<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>카니발 라이언 LMS</title>
<script src="/config.js"></script>
<style>
  body { margin: 0; background: #f5f7f4; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, sans-serif; }
  .spin { width: 36px; height: 36px; border: 3px solid #d8ded8; border-top-color: #137a70; border-radius: 50%; animation: s .7s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="spin"></div>
<script>
(async () => {
  const API = (window.CARNIVAL_LION_API_URL || '').replace(/\/$/, '');
  try {
    const res = await fetch(API + '/api/auth/me', { credentials: 'include' });
    if (res.status === 401) { location.replace('/login.html'); return; }
    const data = await res.json();
    if (data.role === 'admin') { location.replace('/admin.html'); return; }
    if (data.role === 'student') { location.replace('/student.html'); return; }
    location.replace('/login.html');
  } catch { location.replace('/login.html'); }
})();
</script>
</body>
</html>
